  - "cargo test --locked --manifest-path src-tauri/Cargo.toml: 9 passed, including saved/missing/corrupt configuration and existing real HTTP/WebSocket/DPAPI restoration."
  - "pnpm exec vitest run src/lib/desktop-connection.test.js src/lib/desktop-preferences.test.ts: 4 passed. Tests invoke the real connection form module with mocked native interfaces; do not inspect source text."
  - "Isolated in-app browser preview verified the real connection form markup/script displays the selected address and local directory. Native invoke/listen were mocked."
  - "Published with desktop/package-windows.ps1 as fresh byte streams outside the Low-labeled workspace."
limitations:
