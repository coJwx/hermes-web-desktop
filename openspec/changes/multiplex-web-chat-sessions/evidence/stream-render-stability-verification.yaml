  - Pending tools absent from a snapshot require a matching confirmed running-turn timestamp and runtime.
  - A legacy in-flight render slot is not proof of turn identity or exactly-once snapshot/delta delivery.
  - Retained output lives within the existing bounded transcript; discarded or never-received output cannot be restored locally.
  - Existing remote/native acceptance tasks remain incomplete; terminal canvas warnings are JSDOM limitations.
