[package]
name = "hermes-dashboard"
version = "0.2.0"
edition = "2021"
rust-version = "1.89"

[build-dependencies]
tauri-build = { version = ">=2.0,<3", features = [] }

[dependencies]
tauri = { version = ">=2.0,<3", features = ["unstable", "devtools"] }
axum = { version = ">=0.8.9,<0.10", features = ["ws"] }
tokio = { version = ">=1.48,<2", features = ["net", "rt-multi-thread", "sync", "time", "macros"] }
reqwest = { version = ">=0.12.28,<0.14", default-features = false, features = ["rustls-tls", "cookies", "stream"] }
tokio-tungstenite = { version = ">=0.29,<0.30", features = ["rustls-tls-webpki-roots"] }
futures-util = ">=0.3.31,<0.5"
include_dir = ">=0.7.4,<0.9"
mime_guess = ">=2.0.5,<3"
regex = ">=1.11,<2"
serde = { version = ">=1.0,<2", features = ["derive"] }
serde_json = ">=1.0,<2"
url = ">=2.5,<3"
uuid = { version = ">=1.18,<2", features = ["v4"] }
cookie_store = { version = ">=0.22.1,<0.23", features = ["serde_json"] }
sha2 = ">=0.10.9,<0.11"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = ">=0.61.2,<0.63", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
