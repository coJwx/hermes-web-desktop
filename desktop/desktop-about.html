<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>关于 Hermes Dashboard</title>
<style>
:root{color-scheme:light dark;font:13px "Segoe UI","Microsoft YaHei",sans-serif;background:#f0f4f9;color:#202020}body{margin:0;padding:24px}h1{font-size:21px;margin:0 0 6px}.version{color:#526275;margin:0 0 18px}dl{display:grid;grid-template-columns:90px 1fr;gap:12px 10px;margin:0}dt{color:#526275}dd{margin:0;overflow-wrap:anywhere;user-select:text}footer{margin-top:20px;font-size:12px;line-height:1.7;color:#526275;border-top:1px solid #0002;padding-top:12px}#error{color:#b42318}@media(prefers-color-scheme:dark){:root{background:#202020;color:#f0f0f0}dt,.version,footer{color:#b9c5d4}footer{border-color:#fff2}}
